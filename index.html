    <title>Cutscene | Unlock Your Scene</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Oswald', 'sans-serif'],
            },
            colors: {
              'cutscene-bg': '#0f172a', // Deep Slate
              'cutscene-blue': '#7dd3fc', // Light Sky Blue
              'cutscene-blue-glow': '#38bdf8', // Slightly darker for hover
              'cutscene-text': '#f1f5f9', // Slate 100
              'cutscene-red': '#ef4444', // For failure/accents
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-out forwards',
              'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glitch': 'glitch 0.2s linear infinite',
              'heartbeat': 'heartbeat 1s ease-in-out infinite',
              'float': 'float 6s ease-in-out infinite',
              'sparkle': 'sparkle 1.5s linear infinite',
              'shine': 'shine 4s linear infinite',
              'flash-wipe': 'flashWipe 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(40px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              glitch: {
                '0%': { transform: 'translate(0)' },
                '20%': { transform: 'translate(-2px, 2px)' },
                '40%': { transform: 'translate(-2px, -2px)' },
                '60%': { transform: 'translate(2px, 2px)' },
                '80%': { transform: 'translate(2px, -2px)' },
                '100%': { transform: 'translate(0)' },
              },
              heartbeat: {
                '0%, 100%': { transform: 'scale(1)', boxShadow: 'inset 0 0 0 transparent' },
                '50%': { transform: 'scale(1.02)', boxShadow: 'inset 0 0 50px rgba(239, 68, 68, 0.3)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              sparkle: {
                '0%, 100%': { opacity: '0', transform: 'scale(0)' },
                '50%': { opacity: '1', transform: 'scale(1)' },
              },
              shine: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' }
              },
              flashWipe: {
                '0%': { transform: 'translateX(-150%) skewX(-20deg)' },
                '100%': { transform: 'translateX(150%) skewX(-20deg)' }
              }
            }
          },
        },
      }
    </script>
    <style>

        transform-style: preserve-3d;
      }

        backface-visibility: hidden;
      }
    </style>
